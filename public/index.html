<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent-kontor</title>
  <style>
    :root {
      --bg: #EEF1EC;
      --ink: #1E2630;
      --soft: #5F6B76;
      --line: #D3DAD3;
      --chip: #FFFFFF;
      --accent: #2F86D6;
      --alert: #E5484D;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #15191E; --ink: #E7ECF0; --soft: #8D98A3; --line: #2A323B; --chip: #1F262D; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 'Segoe UI', system-ui, -apple-system, sans-serif; }
    header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; flex-wrap: wrap; }
    h1 { font-size: 16px; margin: 0 8px 0 0; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
    .tab { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px; padding: 4px 12px; cursor: pointer; font: inherit; display: flex; align-items: center; gap: 6px; }
    .tab[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .status { color: var(--soft); font-size: 12px; }
    .status.lost { color: var(--alert); }
    main { padding: 0 16px 16px; display: grid; gap: 14px; justify-items: center; }
    canvas { width: min(100%, 980px); height: auto; image-rendering: pixelated; border-radius: 12px; display: block; }
    .alert { width: min(100%, 980px); border: 1px solid var(--alert); color: var(--alert); border-radius: 10px; padding: 8px 12px; }
    .alert:empty { display: none; }
    ul.people { list-style: none; margin: 0; padding: 0; width: min(100%, 980px); display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    ul.people li { display: grid; grid-template-columns: 14px 1fr; gap: 2px 8px; align-items: start; }
    ul.people .dot { margin-top: 6px; }
    .name { font-weight: 600; }
    .what { grid-column: 2; }
    .note { grid-column: 2; color: var(--soft); font-size: 12px; }
    .empty { color: var(--soft); text-align: center; padding: 40px 16px; }
  </style>
</head>
<body>
  <header>
    <h1>Agent-kontor</h1>
    <nav class="tabs" id="tabs" aria-label="Sessioner"></nav>
    <span class="status" id="status">Forbinder…</span>
  </header>
  <main>
    <canvas id="office" width="1440" height="1524" aria-label="Kontoret set ovenfra"></canvas>
    <div class="alert" id="alert" role="status"></div>
    <ul class="people" id="people"></ul>
  </main>
  <script src="/app.js"></script>
</body>
</html>
