<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent-kontor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='3' width='12' height='12' rx='1' fill='%232F3A4A'/%3E%3Crect x='4' y='5' width='3' height='3' fill='%23A9D8F5'/%3E%3Crect x='9' y='5' width='3' height='3' fill='%23A9D8F5'/%3E%3Crect x='4' y='10' width='3' height='3' fill='%23A9D8F5'/%3E%3Crect x='9' y='10' width='3' height='5' fill='%23C8643B'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- The office fills the window; everything else floats over it. -->
  <canvas id="office" aria-label="Kontoret set ovenfra. Træk for at flytte, rul for at zoome, og klik på en figur for at se, hvad den laver." data-en-label="The office seen from above. Drag to move, scroll to zoom, and click a figure to see what it is doing."></canvas>

  <header>
    <div class="hud topbar">
      <div class="brand">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="12" rx="1" fill="#2F3A4A"/><rect x="2" y="3" width="12" height="2" fill="#5A6672"/><rect x="4" y="6" width="3" height="3" fill="#A9D8F5"/><rect x="9" y="6" width="3" height="3" fill="#A9D8F5"/><rect x="4" y="10" width="3" height="3" fill="#A9D8F5"/><rect x="9" y="10" width="3" height="5" fill="#C8643B"/></svg>
        <h1>Agent-kontor</h1>
      </div>
      <nav class="tabs" id="tabs" aria-label="Sessioner" data-en-label="Sessions"></nav>
    </div>
    <div class="hud chips">
      <button class="chip" id="mood" type="button" hidden></button>
      <span class="chip" id="saldo" title="Tjent ved arbejdet i alle dine sessioner" data-en-title="Earned by the work in all your sessions" hidden><span class="coin" aria-hidden="true"></span><span id="saldo-value"></span></span>
      <button class="chip icon-chip" id="settings" type="button" aria-label="Indstillinger" data-en-label="Settings" hidden></button>
      <button class="chip icon-chip" id="help" type="button" aria-label="Rundvisning" data-en-label="Tour" hidden></button>
      <button class="chip icon-chip" id="tv" type="button" aria-label="Tv-tilstand" data-en-label="TV mode" aria-pressed="false" hidden></button>
      <button class="chip icon-chip" id="sound" type="button" aria-label="Lyd" data-en-label="Sound"></button>
      <button class="chip icon-chip" id="notify" type="button" aria-label="Beskeder" data-en-label="Notifications" hidden></button>
      <span class="conn" id="conn" title="Forbinder…" data-en-title="Connecting…" role="status" aria-label="Forbinder" data-en-label="Connecting"></span>
    </div>
  </header>

  <div class="lost-banner" id="lost" role="alert" data-en="The connection to the office is lost. The page keeps trying by itself; if Claude is closed, press 🏢 Open office in Claude." hidden>Forbindelsen til kontoret er tabt. Siden prøver igen af sig selv; er Claude lukket, så tryk på 🏢 Åbn kontor i Claude.</div>
  <div class="waiting" id="alert" role="status" hidden></div>

  <aside class="side" id="side" aria-label="Panel" data-en-label="Panel">
    <div class="side-head">
      <div class="panels" role="tablist">
        <button type="button" data-panel="people" aria-pressed="true" data-en="Who’s doing what">Hvem laver hvad</button>
        <button type="button" data-panel="shop" aria-pressed="false" data-en="Shop">Butik</button>
        <button type="button" data-panel="progress" aria-pressed="false" data-en="Progress">Fremskridt</button>
      </div>
      <button class="fold" id="side-toggle" type="button" title="Fold panelet sammen" data-en-title="Fold the panel away" aria-label="Fold panelet sammen" data-en-label="Fold the panel away">‹</button>
    </div>
    <div class="side-body">
      <ul class="people" id="people"></ul>
      <section class="shop" id="shop" hidden></section>
      <section class="progress-panel" id="progress" hidden></section>
    </div>
  </aside>
  <button class="hud side-open" id="side-open" type="button" data-en="☰ Panel" hidden>☰ Panel</button>

  <section class="feed" id="feed" aria-label="Aktivitet" data-en-label="Activity" aria-live="polite" hidden></section>
  <div class="card" id="card" role="dialog" aria-label="Detaljer" data-en-label="Details" hidden></div>
  <div class="corner">
    <button class="hud fit-all" id="fit-all" type="button" data-en="Show the whole office" hidden>Vis hele kontoret</button>
    <canvas class="minimap" id="minimap" aria-label="Oversigt over kontoret" data-en-label="Overview of the office" hidden></canvas>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
