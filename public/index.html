<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent-kontor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='3' width='12' height='12' rx='1' fill='%232F3A4A'/%3E%3Crect x='4' y='5' width='3' height='3' fill='%23A9D8F5'/%3E%3Crect x='9' y='5' width='3' height='3' fill='%23A9D8F5'/%3E%3Crect x='4' y='10' width='3' height='3' fill='%23A9D8F5'/%3E%3Crect x='9' y='10' width='3' height='5' fill='%23C8643B'/%3E%3C/svg%3E">
  <style>
    /* ── Tokens ─────────────────────────────────────────────────────────── */
    /* Dark only: the office is drawn for a dark page around it. */
    :root {
      color-scheme: dark;
      --bg: #11151A;
      --surface: #191F26;
      --surface-2: #20272F;
      --ink: #E7ECF0;
      --soft: #9AA5B0;
      --faint: #6C7782;
      --line: #2A323B;
      --accent: #3B8FE0;
      --good: #2E9E8F;
      --warn: #D6A23C;
      --alert: #E5484D;
      --claude: #C8643B;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.35);
      --radius: 14px;
      --office: 0.945;
      --side: 300px;
      --top: 64px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { display: flex; flex-direction: column; }
    button { font: inherit; color: inherit; }
    [hidden] { display: none !important; }

    /* ── Header ─────────────────────────────────────────────────────────── */
    header { display: flex; align-items: center; gap: 14px; padding: 12px 20px; flex-wrap: wrap; flex: none; }
    .brand { display: flex; align-items: center; gap: 10px; margin-right: 6px; }
    .brand svg { width: 28px; height: 28px; image-rendering: pixelated; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.15)); }
    .brand h1 { font-size: 16px; margin: 0; letter-spacing: -0.01em; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
    .tab { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px 5px 10px; cursor: pointer; display: flex; align-items: center; gap: 7px; font-size: 13px; transition: border-color 0.15s, background 0.15s; }
    .tab:hover { border-color: var(--faint); }
    .tab[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); font-weight: 600; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
    .chips { display: flex; align-items: center; gap: 8px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    button.chip { cursor: pointer; }
    .coin { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #F6D77A, #D6A23C 60%, #A8781E); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15); }
    .conn { width: 10px; height: 10px; border-radius: 50%; background: var(--faint); box-shadow: 0 0 0 3px color-mix(in srgb, var(--faint) 25%, transparent); }
    .conn.live { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
    .conn.lost { background: var(--alert); box-shadow: 0 0 0 3px color-mix(in srgb, var(--alert) 25%, transparent); }
    .lost-banner { margin: 0 20px 10px; padding: 8px 14px; border-radius: 10px; background: color-mix(in srgb, var(--alert) 12%, var(--surface)); color: var(--alert); border: 1px solid color-mix(in srgb, var(--alert) 40%, transparent); font-size: 13px; }

    /* ── Layout ─────────────────────────────────────────────────────────── */
    /* The office takes all the room the window has; the panel sits beside it
       when there is width to spare, and under it when there is not. --office
       is the office's width over its height, which app.js sets from the scene;
       the page is never wider than the office at full height plus the panel,
       so the two stay together on a wide screen. */
    main {
      flex: 1; min-height: 0; width: 100%; margin: 0 auto; display: grid; gap: 20px; padding: 0 20px 20px;
      grid-template-columns: minmax(0, 1fr) var(--side);
      max-width: calc((100vh - var(--top) - 20px) * var(--office) + var(--side) + 60px);
    }
    .stage { position: relative; min-width: 0; min-height: 0; display: flex; align-items: flex-start; justify-content: flex-end; }
    canvas { display: block; image-rendering: pixelated; }
    canvas#office { touch-action: none; border-radius: var(--radius); box-shadow: 0 0 0 1px var(--line), var(--shadow); }
    aside { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    @media (max-width: 760px) {
      header { padding: 10px 14px; }
      main { max-width: none; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; align-content: start; overflow-y: auto; padding: 0 14px 14px; gap: 14px; }
      .stage { justify-content: center; min-height: auto; }
      aside { overflow: visible; min-height: auto; }
    }

    /* ── The panel beside the office ────────────────────────────────────── */
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 10px; display: grid; gap: 10px; }
    .panels { display: flex; gap: 4px; padding: 3px; border-radius: 10px; background: var(--surface-2); }
    .panels button { flex: 1; border: 0; background: none; color: var(--soft); font-size: 13px; padding: 6px 8px; border-radius: 7px; cursor: pointer; }
    .panels button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }

    /* Waiting for you */
    .waiting { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--alert) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--alert) 45%, transparent); }
    .waiting strong { color: var(--alert); font-size: 13px; }
    .waiting p { margin: 0; grid-column: 1; font-size: 13px; }
    .waiting button { grid-row: 1 / span 2; grid-column: 2; border: 0; border-radius: 8px; padding: 6px 12px; background: var(--alert); color: #FFFFFF; font-weight: 600; cursor: pointer; }

    /* Who is doing what */
    .people { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    .person { display: grid; grid-template-columns: 36px 1fr auto; gap: 2px 10px; align-items: center; padding: 8px; border-radius: 10px; background: var(--surface-2); border: 1px solid transparent; }
    .person.is-claude { background: color-mix(in srgb, var(--claude) 8%, var(--surface-2)); }
    .person.is-waiting { border-color: color-mix(in srgb, var(--alert) 55%, transparent); }
    .person img { grid-row: 1 / span 3; width: 36px; height: 36px; border-radius: 9px; image-rendering: pixelated; background: var(--surface); }
    .person .name { font-weight: 600; font-size: 13px; }
    .person .what { grid-column: 2 / span 2; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .person .note { grid-column: 2 / span 2; color: var(--soft); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pill { justify-self: end; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
    .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--faint); margin: 4px 2px 0; }
    .empty { color: var(--soft); text-align: center; padding: 28px 12px; display: grid; gap: 6px; justify-items: center; }
    .empty .big { font-size: 34px; }
    .empty strong { color: var(--ink); }
    @media (max-width: 760px) { .people { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); } }

    /* The details card over the office, next to the figure it is about */
    .card {
      position: absolute; left: 0; top: 0; width: 250px; padding: 12px 14px 14px; border-radius: 12px;
      background: var(--surface); color: var(--ink); border: 1px solid var(--line);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28); font-size: 13px; pointer-events: auto; z-index: 2;
    }
    .card-head { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .card-close { margin-left: auto; border: 0; background: none; color: var(--soft); font-size: 18px; line-height: 1; cursor: pointer; padding: 0 2px; }
    .card-task { color: var(--soft); margin-top: 2px; }
    .card-now { margin-top: 8px; font-weight: 600; }
    .card-note { color: var(--soft); }
    .card-facts { margin-top: 6px; color: var(--soft); font-size: 12px; }
    .card-label { margin-top: 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--faint); }
    .card-steps { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 2px; }
    .card-steps time { color: var(--soft); font-variant-numeric: tabular-nums; margin-right: 8px; }

    /* Over the picture's corners once it is zoomed in */
    .fit-all { position: absolute; z-index: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer; box-shadow: var(--shadow); }
    .minimap { position: absolute; z-index: 1; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; box-shadow: var(--shadow); }

    /* ── The shop ───────────────────────────────────────────────────────── */
    .shop { display: grid; gap: 10px; }
    .shop h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--faint); margin: 6px 2px 0; }
    .shop-saldo { display: flex; align-items: center; gap: 10px; padding: 4px 2px; }
    .shop-saldo .coin { width: 22px; height: 22px; }
    .shop-saldo strong { font-size: 24px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
    .shop-message { margin: 0; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); }
    .items, .rates { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .item { padding: 10px 12px; border-radius: 12px; background: var(--surface-2); display: grid; grid-template-columns: 32px 1fr; gap: 4px 10px; align-items: start; }
    .item.is-owned { opacity: 0.75; }
    .item > :not(.icon) { grid-column: 2; }
    .item .icon { grid-row: 1 / span 6; font-size: 22px; line-height: 32px; text-align: center; width: 32px; height: 32px; border-radius: 9px; background: var(--surface); }
    .item-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .item-count { color: var(--soft); font-size: 12px; }
    .hint { color: var(--soft); font-size: 12px; margin: 0; }
    .progress { display: block; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
    .progress > span { display: block; height: 100%; border-radius: 3px; background: var(--warn); transition: width 0.6s; }
    .owned { color: var(--good); font-size: 12px; font-weight: 600; margin: 0; }
    .buy { border: 0; border-radius: 8px; padding: 7px 10px; font-weight: 600; cursor: pointer; background: var(--good); color: #FFFFFF; }
    .buy:disabled { background: var(--line); color: var(--soft); cursor: default; }
    .mood-box { padding: 10px 12px; border-radius: 12px; background: var(--surface-2); display: grid; gap: 6px; }
    .mood-bar { display: block; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
    .mood-fill { display: block; height: 100%; border-radius: 3px; transition: width 0.6s; }
    .mood-parts { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: 12px; }
    .mood-parts li { display: grid; grid-template-columns: 36px 1fr; }
    .plus { color: var(--good); font-weight: 600; }
    .minus { color: var(--alert); font-weight: 600; }
    .rates li { display: grid; grid-template-columns: 64px 1fr; font-size: 13px; }
    .rate { font-weight: 600; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="12" rx="1" fill="#2F3A4A"/><rect x="2" y="3" width="12" height="2" fill="#5A6672"/><rect x="4" y="6" width="3" height="3" fill="#A9D8F5"/><rect x="9" y="6" width="3" height="3" fill="#A9D8F5"/><rect x="4" y="10" width="3" height="3" fill="#A9D8F5"/><rect x="9" y="10" width="3" height="5" fill="#C8643B"/></svg>
      <h1>Agent-kontor</h1>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sessioner"></nav>
    <div class="chips">
      <button class="chip" id="mood" type="button" hidden></button>
      <span class="chip" id="saldo" title="Tjent ved arbejdet i alle dine sessioner" hidden><span class="coin" aria-hidden="true"></span><span id="saldo-value"></span></span>
      <span class="conn" id="conn" title="Forbinder…" role="status" aria-label="Forbinder"></span>
    </div>
  </header>
  <div class="lost-banner" id="lost" role="alert" hidden>Forbindelsen til kontoret er tabt. Siden prøver igen af sig selv; er Claude lukket, så tryk på 🏢 Åbn kontor i Claude.</div>
  <main>
    <div class="stage" id="stage">
      <canvas id="office" aria-label="Kontoret set ovenfra. Klik på en figur for at se, hvad den laver."></canvas>
      <div class="card" id="card" role="dialog" aria-label="Detaljer" hidden></div>
      <button class="fit-all" id="fit-all" type="button" hidden>Vis hele</button>
      <canvas class="minimap" id="minimap" aria-label="Oversigt over kontoret" hidden></canvas>
    </div>
    <aside>
      <div id="alert" hidden></div>
      <div class="panel">
        <div class="panels" role="tablist">
          <button type="button" data-panel="people" aria-pressed="true">Hvem laver hvad</button>
          <button type="button" data-panel="shop" aria-pressed="false">Butik</button>
        </div>
        <ul class="people" id="people"></ul>
        <section class="shop" id="shop" hidden></section>
      </div>
    </aside>
  </main>
  <script src="/app.js"></script>
</body>
</html>
